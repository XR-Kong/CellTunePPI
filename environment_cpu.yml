# CPU environment for Linux or Windows on x86_64.
# Create with: conda env create --file environment_cpu.yml
# Activate with: conda activate celltuneppi
# Add --device cpu when running a model entry point.
name: celltuneppi
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=25.1.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0+cpu
      - numpy==1.26.4
      - pandas==2.3.0
      - scipy==1.15.3
      - anndata==0.11.4
      - h5py==3.14.0
      - matplotlib==3.10.3
      - scanpy==1.11.2
      - numba==0.61.2
      - llvmlite==0.44.0
      - scikit-learn==1.7.0
      - umap-learn==0.5.7
